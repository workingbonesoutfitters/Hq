<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://whvgwshdppluudzkhcqp.supabase.co; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Design drop box · Business HQ</title>
<style>
:root{--gold:#c9a24a;--gold2:#e6c878;--text:#f3ede0;--muted:#a59f92;--bad:#ef8f7a;--ok:#9fd39a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#050506;color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px 40px}
main{width:100%;max-width:480px}
h1{font:600 26px Georgia,serif;color:var(--gold2);margin:8px 0 4px}
h2{font-size:17px;color:var(--gold2);margin:22px 0 8px}
p{color:var(--muted);margin:0 0 14px}
.card{background:#111113;border:1px solid rgba(201,162,74,.4);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input{width:100%;font:16px inherit;color:var(--text);background:#070708;border:1px solid #2c2c31;border-radius:12px;padding:12px}
input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
button{width:100%;margin-top:14px;font-family:inherit;font-weight:700;font-size:17px;min-height:50px;border-radius:14px;border:1px solid var(--gold);background:var(--gold);color:#16120a}
button.ghost{background:transparent;color:var(--gold2);font-weight:600}
button:disabled{opacity:.5}
.msg{margin-top:12px;font-size:14px}.bad{color:var(--bad)}.good{color:var(--ok)}
.item{border-top:1px solid #222;padding:10px 0}.item:first-child{border-top:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid #444;margin-left:6px}
.pending{color:var(--gold2);border-color:var(--gold)}.approved{color:var(--ok);border-color:var(--ok)}.revise{color:var(--bad);border-color:var(--bad)}
.note{background:#2a1714;border:1px solid #6b2f25;border-radius:10px;padding:8px 10px;margin-top:6px;color:#ffd9cf;font-size:14px}
small{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Design drop box</h1>
<p>Working Bones · Etsy designs for owner approval. This page can only add files and show your own uploads. It cannot approve, list, edit or delete anything.</p>
<div id="app"></div>
</main>
<script>
"use strict";
const U="https://whvgwshdppluudzkhcqp.supabase.co",K="sb_publishable_NBCZbtnprQY7ffHOeTe4kQ_PCBF9skl",BUCKET="etsy-designs";
const TYPES={svg:"image/svg+xml",pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",dxf:"application/dxf"};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S=null;try{S=JSON.parse(LS.get("hq_drop_sess"))}catch(e){}
let me=null,rows=[],msg="",msgCls="",busy=false,lastEm=LS.get("hq_drop_em")||"";
const uid=()=>{try{return JSON.parse(atob(S.at.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).sub}catch(e){return ""}};
const when=d=>{try{return new Date(d).toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){return ""}};

async function refresh(){
 if(!S||!S.rt)return false;
 const r=await fetch(U+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.rt})});
 if(!r.ok){S=null;LS.del("hq_drop_sess");return false}
 const j=await r.json();S={at:j.access_token,rt:j.refresh_token,em:S.em};LS.set("hq_drop_sess",JSON.stringify(S));return true;
}
async function api(path,o={},retry=true){
 const h={apikey:K,...(o.headers||{})};if(S)h.Authorization="Bearer "+S.at;
 const r=await fetch(U+path,{method:o.method||"GET",headers:h,body:o.body});
 if(r.status===401&&retry&&await refresh())return api(path,o,false);
 let j=null;try{j=await r.clone().json()}catch(e){}
 return {ok:r.ok,status:r.status,j};
}
async function signIn(){
 const em=$("#em").value.trim(),pw=$("#pw").value;lastEm=em;
 if(!em||!pw){msg="Enter your email and password.";msgCls="bad";return render()}
 busy=true;render();
 const r=await api("/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})},false);
 busy=false;
 if(!r.ok){msg="Sign-in failed. Check the email and password.";msgCls="bad";return render()}
 S={at:r.j.access_token,rt:r.j.refresh_token,em};LS.set("hq_drop_sess",JSON.stringify(S));LS.set("hq_drop_em",em);msg="";
 await boot();
}
function signOut(){if(S)fetch(U+"/auth/v1/logout",{method:"POST",headers:{apikey:K,Authorization:"Bearer "+S.at}}).catch(()=>{});S=null;me=null;rows=[];LS.del("hq_drop_sess");msg="Signed out.";msgCls="";render()}
async function boot(){
 if(!S)return render();
 const r=await api("/rest/v1/hq_uploaders?select=label,active,business_id&user_id=eq."+encodeURIComponent(uid()));
 if(!S)return render();
 me=r.ok&&Array.isArray(r.j)&&r.j[0]&&r.j[0].active?r.j[0]:false;
 if(me)await loadRows();
 render();
}
async function loadRows(){
 const r=await api("/rest/v1/hq_etsy_designs?select=title,file_name,file_type,status,revision_note,uploaded_at,decided_at&order=uploaded_at.desc&limit=60");
 rows=r.ok&&Array.isArray(r.j)?r.j:[];
}
async function upload(){
 const files=[...($("#file").files||[])],title=$("#title").value.trim();
 if(!title){msg="Give the design a name first.";msgCls="bad";return render()}
 if(!files.length){msg="Choose at least one file.";msgCls="bad";return render()}
 for(const f of files){const ext=(f.name.split(".").pop()||"").toLowerCase();if(!TYPES[ext]){msg=`${f.name}: use SVG, PDF, PNG, JPG or DXF.`;msgCls="bad";return render()}if(f.size>25*1024*1024){msg=`${f.name} is over 25 MB.`;msgCls="bad";return render()}}
 busy=true;msg=`Uploading ${files.length} file${files.length>1?"s":""}…`;msgCls="";render();
 let done=0;const fails=[];
 for(const f of files){
  const ext=f.name.split(".").pop().toLowerCase(),type=TYPES[ext];
  const safe=f.name.toLowerCase().replace(/[^a-z0-9._-]+/g,"-").replace(/-+/g,"-").slice(-80);
  const path=`wb/up/${uid()}/${new Date().toISOString().slice(0,10)}-${crypto.randomUUID()}-${safe}`;
  const up=await api("/storage/v1/object/"+BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/"),{method:"POST",headers:{"Content-Type":type,"x-upsert":"false"},body:f});
  if(!up.ok){fails.push(`${f.name} (upload ${up.status})`);continue}
  const name=files.length>1?`${title} · ${ext.toUpperCase()}`:title;
  const ins=await api("/rest/v1/hq_etsy_designs",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({business_id:"wb",title:name.slice(0,120),file_path:path,file_name:f.name.slice(0,200),file_type:ext,made_by:me.label,uploaded_by:uid()})});
  if(!ins.ok){fails.push(`${f.name} (list ${ins.status})`);continue}
  done++;
 }
 busy=false;
 msg=fails.length?`${done} uploaded. Failed: ${fails.join(", ")}`:`✓ ${done} file${done>1?"s":""} sent for owner approval.`;msgCls=fails.length?"bad":"good";
 if(!fails.length){$("#title").value="";$("#file").value=""}
 await loadRows();render();
}
function render(){
 const a=$("#app"),m=msg?`<div class="msg ${msgCls}">${esc(msg)}</div>`:"";
 if(!S){a.innerHTML=`<div class="card"><b>Sign in</b><label for="em">Email</label><input id="em" type="email" autocomplete="username" value="${esc(lastEm)}"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><button data-a="in" ${busy?"disabled":""}>${busy?"Signing in…":"Sign in"}</button>${m}</div>`;return}
 if(me===null){a.innerHTML=`<div class="card"><p>Checking your access…</p></div>`;return}
 if(me===false){a.innerHTML=`<div class="card"><b>This account can't use the drop box.</b><p>It isn't set up as an uploader. The owner uses Business HQ instead.</p><button class="ghost" data-a="out">Sign out</button></div>`;return}
 const st={pending:"Waiting for owner",approved:"Approved",revise:"Needs changes"};
 const list=rows.length?rows.map(r=>`<div class="item"><b>${esc(r.title)}</b><span class="chip ${esc(r.status)}">${esc(st[r.status]||r.status)}</span><br><small>${esc(r.file_name)} · sent ${esc(when(r.uploaded_at))}${r.decided_at?` · decided ${esc(when(r.decided_at))}`:""}</small>${r.status==="revise"&&r.revision_note?`<div class="note"><b>What to fix:</b> ${esc(r.revision_note)}</div>`:""}</div>`).join(""):`<p>No uploads yet.</p>`;
 a.innerHTML=`<div class="card"><b>Send a design for approval</b><small style="display:block;margin-top:2px">Signed in as ${esc(me.label)} (${esc(S.em||"")})</small>
 <label for="title">Design name</label><input id="title" maxlength="100" placeholder="Grumpy Skull Coaster v1">
 <label for="file">Files: SVG, DXF, PDF, PNG preview (select several at once)</label><input id="file" type="file" multiple accept=".svg,.pdf,.png,.jpg,.jpeg,.dxf">
 <button data-a="up" ${busy?"disabled":""}>${busy?"Working…":"Send for approval"}</button>${m}</div>
 <div class="card"><h2 style="margin-top:0">Your uploads</h2>${list}<button class="ghost" data-a="reload">Refresh</button></div>
 <button class="ghost" data-a="out">Sign out</button>`;
}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b||busy)return;const x=b.dataset.a;
 if(x==="in")await signIn();else if(x==="up")await upload();else if(x==="out")signOut();else if(x==="reload"){await loadRows();msg="";render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!S&&(e.target.id==="pw"||e.target.id==="em"))signIn()});
boot();
</script>
</body>
</html>
