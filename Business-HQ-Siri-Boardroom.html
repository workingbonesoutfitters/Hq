<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business HQ Boardroom (Siri)</title>
<style>
:root{--card:#111009;--line:#3a3115;--gold:#d4af37;--gold2:#f3d77a;--text:#f1ead6;--dim:#a89c78}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--text);font:16px/1.45 -apple-system,system-ui,sans-serif}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font:600 22px Georgia,serif;color:var(--gold);margin:4px 0 2px}.sub,.note{color:var(--dim);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.src{display:inline-block;border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:2px 10px;font-size:13px;margin-bottom:8px}
textarea{width:100%;min-height:96px;background:#000;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px/1.4 -apple-system,system-ui,sans-serif}
button{background:var(--gold);color:#000;border:0;border-radius:10px;padding:12px 18px;font:600 16px inherit;margin:8px 8px 0 0;cursor:pointer}
button.s{background:transparent;color:var(--gold);border:1px solid var(--gold);font-weight:400;font-size:14px;padding:8px 12px}
#warn{display:none;border:1px solid var(--gold);border-radius:10px;padding:10px;margin-top:10px;font-size:14px;color:var(--gold2)}
.msg{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:12px 0}.msg b{color:var(--gold2)}.tag{color:var(--dim);font-size:12px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}.hide{display:none}
</style></head><body>
<h1>Business HQ Boardroom</h1>
<p class="sub">Siri handoff test. Responses are simulated. Nothing is sent to any AI or saved.</p>

<div class="card">
  <span class="src" id="src">Typed here</span>
  <textarea id="q" maxlength="500" placeholder="Type or dictate a question, or launch this page from the Siri Shortcut."></textarea>
  <div id="warn"></div>
  <button id="ask" type="button">Ask the Boardroom</button>
  <button class="s" id="clr" type="button">Clear</button>
  <div class="note">A Siri question is only placed in the box. You review it, then tap Ask.</div>
</div>

<div class="card hide" id="out"><div id="msgs"></div>
  <button class="s" id="speak" type="button">Read aloud (iPhone voice)</button>
  <button class="s" id="stopSpeak" type="button">Stop</button>
  <div class="note">Read aloud uses Apple's built-in voice, not the custom ChatGPT, Claude and Grok voices.</div></div>

<div class="card"><details><summary style="cursor:pointer;color:var(--gold2)">Diagnostics</summary>
  <pre id="diag" class="note" style="white-space:pre-wrap;word-break:break-word"></pre></details></div>

<script>
(function(){'use strict';
var $=function(i){return document.getElementById(i)},q=$('q'),notes=[];
function clean(s){return String(s||'').replace(/[\u0000-\u001f\u007f]/g,' ').replace(/\s+/g,' ').trim().slice(0,500)}
var raw='',how='';
try{var h=new URLSearchParams(location.hash.replace(/^#/,''));if(h.has('q')){raw=h.get('q');how='hash'}}catch(e){notes.push('Hash parse error: '+e.message)}
if(!how){try{var s=new URLSearchParams(location.search);if(s.has('q')){raw=s.get('q');how='query';notes.push('Question arrived in the ?query part. Query strings are visible to the web host; use #q= instead.')}}catch(e){}}
if(how){q.value=clean(raw);$('src').textContent='From Siri Shortcut (review before asking)';
  try{history.replaceState(null,'',location.pathname)}catch(e){notes.push('Could not clear the URL: '+e.message)}notes.push('Question received via '+how+' ('+q.value.length+' chars); address bar cleared.')}
else notes.push('No question in the URL.');
var risky=/\b(buy|purchase|pay|spend|order|refund|publish|post|launch|approve|delete|remove|erase|send|transfer|charge|subscribe)\b/i;
function check(){var w=$('warn');if(risky.test(q.value)){w.style.display='block';w.textContent='This question contains an action word. This page only gives simulated answers. Nothing will be spent, published, approved, sent or deleted from here.'}else w.style.display='none'}
q.addEventListener('input',check);check();
function reply(t){var k=t.toLowerCase();
  var topic=/today|looking|status|how are we/.test(k)?'overall status':/sale|revenue|profit|money/.test(k)?'sales and profit':/post|market|social|campaign/.test(k)?'marketing':'that question';
  return [['ChatGPT','Strategy view on '+topic+': this is a placeholder. In the live version I would summarize the dashboard and flag anything that needs your approval.'],
          ['Claude','Operations view: no live data is connected on this page, so I cannot report real numbers yet.'],
          ['Grok','Marketing view: nothing real to roast yet. Hook me up to the data and I will have opinions.']]}
var spoken='';
$('ask').addEventListener('click',function(){var t=clean(q.value);if(!t){q.focus();return}
  var box=$('msgs');box.textContent='';spoken='';
  var you=document.createElement('div');you.className='tag';you.textContent='You asked: '+t;box.appendChild(you);
  reply(t).forEach(function(r){var d=document.createElement('div');d.className='msg';var b=document.createElement('b');b.textContent=r[0];var tg=document.createElement('span');tg.className='tag';tg.textContent='  simulated';var p=document.createElement('div');p.textContent=r[1];d.appendChild(b);d.appendChild(tg);d.appendChild(p);box.appendChild(d);spoken+=r[0]+' says. '+r[1]+' '});
  $('out').classList.remove('hide');notes.push('Simulated reply shown. No network request made.');draw()});
$('clr').addEventListener('click',function(){q.value='';$('src').textContent='Typed here';$('warn').style.display='none'});
$('speak').addEventListener('click',function(){if(!('speechSynthesis' in window)){notes.push('speechSynthesis not available');draw();return}speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(spoken);u.lang='en-US';speechSynthesis.speak(u);notes.push('Read aloud started (device voice)');draw()});
$('stopSpeak').addEventListener('click',function(){if('speechSynthesis' in window)speechSynthesis.cancel()});
function draw(){$('diag').textContent=['Page: '+location.pathname,'Secure: '+window.isSecureContext].concat(notes).join('\n')}draw();
})();
</script></body></html>
