<!doctype html>
<html lang="en">
<head>

<title>HQ Executive Office</title>
<style>
:root{--gold:#c9a24a;--gold2:#e6c878;--panel:rgba(12,12,14,.84);--line:rgba(201,162,74,.38);--text:#f3ede0;--muted:#a59f92}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050506;color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.badge{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text);text-decoration:none}
.badge b{color:var(--gold2);font-weight:600}
.badge.demo{background:var(--gold);border-color:var(--gold);color:#16120a;font-weight:700}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(780px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 4px;white-space:nowrap}
button{font:inherit;color:var(--text);background:#17171a;border:1px solid #2c2c31;border-radius:12px;padding:8px 12px;min-height:40px;white-space:nowrap;cursor:pointer}
button:hover{border-color:var(--gold)}
button.on{border-color:var(--gold);color:var(--gold2)}
button.vr{background:var(--gold);color:#16120a;border-color:var(--gold);font-weight:700}
button:disabled{opacity:.5;cursor:default}
.idea{display:flex;gap:6px}
.idea[hidden]{display:none}
.idea input{flex:1;min-width:0;font:inherit;color:var(--text);background:#111113;border:1px solid #2c2c31;border-radius:12px;padding:8px 12px}
.hint{font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:10px 10px 10px 16px;display:none;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast.show{display:flex}
.toast .t{font-weight:600}
.toast .s{font-size:12px;color:var(--muted)}
button.badge{min-height:0;cursor:pointer;font:inherit;font-size:13px}
button.badge.signed{border-color:var(--gold);color:var(--gold2)}
.pair{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.pair[hidden]{display:none}
.pairCard{background:#111113;border:1px solid var(--gold);border-radius:20px;padding:24px;width:100%;max-width:440px;text-align:center}
.pairCard h2{font:600 22px Georgia,serif;color:var(--gold2);margin:0 0 6px}
.pairCard p{color:var(--muted);margin:6px 0}
.pairCard .code{font:700 46px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--gold2);margin:14px 0 6px}
.pairCard .url{color:var(--text);font-weight:600;word-break:break-all}
.pairCard .row{justify-content:center;margin-top:14px}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#050506;color:var(--gold2);font:500 18px Georgia,serif;letter-spacing:.04em}
#boot small{display:block;margin-top:8px;color:var(--muted);font:13px -apple-system,Helvetica,Arial,sans-serif}
</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

// ---------- constants ----------
const $ = (s) => document.querySelector(s);
const PI = Math.PI;
const GOLD = 0xc9a24a, GOLD_HI = 0xf0d48a, COPPER = 0xe0794a;
const SERIF = "Georgia, 'Times New Roman', serif";
const SANS = "-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const TABLE = { y: 0.76, x0: -1.4, x1: 1.4, z0: -2.05, z1: -0.55 };
const DIRECTOR_Z = -2.45;
const V = () => new THREE.Vector3();

const STATIONS = [
  { id: 'desk',       name: 'Executive Desk',      pos: [0, 0, 0],      yaw: 0,      eye: 1.22, pitch: -0.30 },
  { id: 'laser',      name: 'Laser Bench',         pos: [-4.9, 0, -3.2], yaw: PI / 2,  eye: 1.6,  pitch: -0.45 },
  { id: 'book',       name: 'Book Stand',          pos: [-4.9, 0, 1.6],  yaw: PI / 2,  eye: 1.6,  pitch: -0.35 },
  { id: 'apparel',    name: 'Apparel Corner',      pos: [4.9, 0, -3.2],  yaw: -PI / 2, eye: 1.6,  pitch: -0.12 },
  { id: 'brainstorm', name: 'Brainstorm Wall',     pos: [5.0, 0, 1.8],   yaw: -PI / 2, eye: 1.6,  pitch: 0 },
  { id: 'wall',       name: 'Pipeline & Trophies', pos: [0, 0, 2.6],     yaw: PI,      eye: 1.6,  pitch: 0 },
];
const DIRECTORS = [
  { name: 'Claude', title: 'Development Director', accent: 0xe8a070, x: -0.95, phase: 0.0 },
  { name: 'Ava',    title: 'Executive Director',   accent: 0xf4e2b4, x: 0,     phase: 1.3 },
  { name: 'Bob',    title: 'Marketing Director',   accent: 0xa9c1e3, x: 0.95,  phase: 2.6 },
];
// Preview copies of documents already in the Handoffs tray (titles only, nothing is linked yet).
const DOCS = [
  { type: 'PLAN',       title: 'Business HQ next-generation plan', from: 'Claude', to: 'Ava' },
  { type: 'PLAN',       title: 'VR Boardroom plan',                from: 'Claude', to: 'Ava' },
  { type: 'STRATEGY',   title: 'Laser-file strategy',              from: 'Claude', to: 'Bob' },
  { type: 'BOOK DRAFT', title: 'Book two · Outer Space (Rev 1)',   from: 'Claude', to: 'Michael' },
  { type: 'LASER FILE', title: 'Sample vector · test sign',        from: 'Sample', to: 'Michael' },
];

// ---------- renderer / scene ----------
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
if (renderer.xr.setFoveation) renderer.xr.setFoveation(1);
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d1c2);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 60);
camera.rotation.order = 'YXZ';
const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);

// ---------- materials ----------
const std = (color, roughness, metalness, envMapIntensity = 0.35) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, envMapIntensity });
const MAT = {
  floor: std(0xcdc2ad, 0.3, 0.05, 0.5),
  rug: std(0x18181b, 0.95, 0.0, 0.15),
  wall: std(0xeee5d1, 0.9, 0.0, 0.3),
  ceiling: std(0xf6f1e8, 0.95, 0.0, 0.3),
  gold: std(GOLD, 0.24, 1.0, 1.1),
  bronze: std(0x5a4a2a, 0.35, 1.0, 0.7),
  glass: std(0x060608, 0.05, 0.75, 1.0),
  leather: std(0x111113, 0.55, 0.05, 0.3),
  body: std(0x1e1e23, 0.38, 0.35, 0.65),
  form: std(0x2a2a2f, 0.5, 0.2, 0.5),
  bench: std(0x19191c, 0.6, 0.2, 0.4),
};
const glowMat = (color, opacity = 1) =>
  new THREE.MeshBasicMaterial({ color, transparent: true, opacity, toneMapped: false, depthWrite: opacity >= 1 });

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}

// ---------- canvas text helpers ----------
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}
function wrap(c, text, x, y, maxW, lh, maxLines = 6) {
  const words = String(text).split(/\s+/);
  let line = '', n = 0;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (c.measureText(t).width > maxW && line) {
      c.fillText(line, x, y); y += lh; line = w;
      if (++n >= maxLines) return y;
    } else line = t;
  }
  if (line) { c.fillText(line, x, y); y += lh; }
  return y;
}
function canvasTex(wPx, hPx, draw) {
  const cv = document.createElement('canvas');
  cv.width = Math.min(2048, Math.max(16, Math.round(wPx)));
  cv.height = Math.min(2048, Math.max(16, Math.round(hPx)));
  const ctx = cv.getContext('2d');
  draw(ctx, cv.width, cv.height);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  tex.userData = { cv, ctx };
  return tex;
}
function repaint(tex, draw) {
  const { cv, ctx } = tex.userData;
  ctx.clearRect(0, 0, cv.width, cv.height);
  draw(ctx, cv.width, cv.height);
  tex.needsUpdate = true;
}
function labelPlane(w, h, draw, { px = 1000, transparent = true, side = THREE.FrontSide } = {}) {
  const tex = canvasTex(w * px, h * px, draw);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent, toneMapped: false, side });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.userData.tex = tex;
  m.userData.draw = draw;
  return m;
}
function panelBg(c, w, h, { fill = 'rgba(10,10,12,0.9)', stroke = '#c9a24a', radius = 0.08 } = {}) {
  const r = Math.min(w, h) * radius, lw = Math.max(3, h * 0.02);
  rr(c, lw, lw, w - lw * 2, h - lw * 2, r);
  c.fillStyle = fill; c.fill();
  c.strokeStyle = stroke; c.lineWidth = lw; c.stroke();
}
function sprite(text, sub) {
  const tex = canvasTex(1024, 256, (c, w, h) => {
    panelBg(c, w, h, { radius: 0.3 });
    c.textAlign = 'center';
    c.fillStyle = '#e6c878';
    c.font = `600 ${sub ? 84 : 96}px ${SERIF}`;
    c.fillText(text, w / 2, sub ? h * 0.5 : h * 0.62);
    if (sub) { c.font = `500 38px ${SANS}`; c.fillStyle = '#c9bea4'; c.fillText(sub, w / 2, h * 0.8); }
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, toneMapped: false, transparent: true, depthWrite: false }));
  s.scale.set(1.15, 0.29, 1);
  return s;
}

// ---------- interaction registry ----------
const hitables = [];
function register(mesh, kind, owner, extra = {}) {
  mesh.userData.kind = kind;
  mesh.userData.owner = owner;
  Object.assign(mesh.userData, extra);
  hitables.push(mesh);
  return mesh;
}
function isShown(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }

function makeButton(w, h, text, onPress, { sub = '', parent = scene } = {}) {
  const draw = (c, W, H, on) => {
    panelBg(c, W, H, { fill: on ? '#c9a24a' : 'rgba(18,18,21,0.95)', radius: 0.25 });
    c.textAlign = 'center';
    c.fillStyle = on ? '#16120a' : '#f0e6cc';
    c.font = `600 ${H * (sub ? 0.34 : 0.42)}px ${SANS}`;
    c.fillText(text, W / 2, sub ? H * 0.5 : H * 0.64);
    if (sub) { c.font = `500 ${H * 0.2}px ${SANS}`; c.fillStyle = on ? '#2a210c' : '#a59f92'; c.fillText(sub, W / 2, H * 0.8); }
  };
  const m = labelPlane(w, h, (c, W, H) => draw(c, W, H, false), { px: 2000 });
  m.userData.setOn = (on) => repaint(m.userData.tex, (c, W, H) => draw(c, W, H, on));
  parent.add(m);
  return register(m, 'button', m, { onPress });
}

// ---------- room ----------
function buildRoom() {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 11), MAT.floor);
  floor.rotation.x = -PI / 2; floor.position.set(0, 0, -0.5); scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(14, 11), MAT.ceiling);
  ceil.rotation.x = PI / 2; ceil.position.set(0, 3.4, -0.5); scene.add(ceil);
  const wallL = new THREE.Mesh(new THREE.PlaneGeometry(11, 3.4), MAT.wall);
  wallL.rotation.y = PI / 2; wallL.position.set(-7, 1.7, -0.5); scene.add(wallL);
  const wallR = new THREE.Mesh(new THREE.PlaneGeometry(11, 3.4), MAT.wall);
  wallR.rotation.y = -PI / 2; wallR.position.set(7, 1.7, -0.5); scene.add(wallR);
  const wallF = new THREE.Mesh(new THREE.PlaneGeometry(14, 3.4), MAT.wall);
  wallF.rotation.y = PI; wallF.position.set(0, 1.7, 5); scene.add(wallF);

  // floor-to-ceiling windows on the far wall
  box(14, 0.32, 0.14, MAT.wall, 0, 0.16, -6);
  box(14, 0.22, 0.14, MAT.wall, 0, 3.29, -6);
  box(1.0, 3.4, 0.14, MAT.wall, -6.5, 1.7, -6);
  box(1.0, 3.4, 0.14, MAT.wall, 6.5, 1.7, -6);
  box(12.02, 0.015, 0.16, MAT.gold, 0, 0.325, -5.99);
  box(12.02, 0.015, 0.16, MAT.gold, 0, 3.175, -5.99);
  for (let x = -6; x <= 6; x += 2) box(0.06, 2.86, 0.1, MAT.bronze, x, 1.75, -6);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(12, 2.86),
    new THREE.MeshStandardMaterial({ color: 0x8899aa, transparent: true, opacity: 0.06, roughness: 0.05, metalness: 0.9 }));
  glass.position.set(0, 1.75, -5.97); scene.add(glass);

  // gold wall reveals (subtle vertical lines)
  for (const z of [-4, -1, 2]) {
    box(0.012, 3.0, 0.012, MAT.gold, -6.99, 1.6, z);
    box(0.012, 3.0, 0.012, MAT.gold, 6.99, 1.6, z);
  }
  // skirting + crown in gold
  box(0.02, 0.02, 11, MAT.gold, -6.99, 0.12, -0.5); box(0.02, 0.02, 11, MAT.gold, 6.99, 0.12, -0.5);
  box(14, 0.02, 0.02, MAT.gold, 0, 0.12, 4.99);

  // ceiling cove light + downlights
  const cove = glowMat(0xffd28a, 0.9);
  box(13.6, 0.02, 0.05, cove, 0, 3.37, 4.75); box(13.6, 0.02, 0.05, cove, 0, 3.37, -5.75);
  box(0.05, 0.02, 10.4, cove, -6.75, 3.37, -0.5); box(0.05, 0.02, 10.4, cove, 6.75, 3.37, -0.5);
  const dl = glowMat(0xfff0d0, 1);
  for (const [x, z] of [[-1, -1.3], [0, -1.3], [1, -1.3], [-5.5, -3.2], [-5.5, 1.6], [5.5, -3.2], [5.6, 1.8], [-1.5, 3.8], [1.5, 3.8]]) {
    const d = new THREE.Mesh(new THREE.CircleGeometry(0.07, 20), dl);
    d.rotation.x = PI / 2; d.position.set(x, 3.395, z); scene.add(d);
  }

  // rug under the desk with a gold border
  const rug = new THREE.Mesh(new THREE.PlaneGeometry(5, 4.2), MAT.rug);
  rug.rotation.x = -PI / 2; rug.position.set(0, 0.003, -1.3); scene.add(rug);
  box(5, 0.004, 0.025, MAT.gold, 0, 0.005, -3.4); box(5, 0.004, 0.025, MAT.gold, 0, 0.005, 0.8);
  box(0.025, 0.004, 4.2, MAT.gold, -2.5, 0.005, -1.3); box(0.025, 0.004, 4.2, MAT.gold, 2.5, 0.005, -1.3);
}

// ---------- living window ----------
let skyTex, sun;
function skyState(hour) {
  if (hour < 5 || hour >= 21) return { name: 'night', g: ['#02030a', '#0a1026', '#1d1b2e'], lit: 0.85, sun: 0x5566aa, si: 0.25, orb: '#e8e6d8', orbY: 0.22 };
  if (hour < 8) return { name: 'dawn', g: ['#1c2a4c', '#b98572', '#f3c48d'], lit: 0.35, sun: 0xffc48a, si: 0.9, orb: '#ffd9a0', orbY: 0.62 };
  if (hour < 17) return { name: 'day', g: ['#2c6bb2', '#7fb0de', '#dbe7ef'], lit: 0.05, sun: 0xfff2dd, si: 1.4, orb: '#fffbe8', orbY: 0.18 };
  return { name: 'dusk', g: ['#1a1938', '#9c4e69', '#f2a35c'], lit: 0.6, sun: 0xffa86a, si: 0.8, orb: '#ffcf8a', orbY: 0.6 };
}
function drawSky(c, w, h) {
  const st = skyState(new Date().getHours());
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, st.g[0]); g.addColorStop(0.62, st.g[1]); g.addColorStop(1, st.g[2]);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = st.orb; c.globalAlpha = 0.9;
  c.beginPath(); c.arc(w * 0.72, h * st.orbY, h * 0.05, 0, PI * 2); c.fill(); c.globalAlpha = 1;
  if (st.name === 'night') { c.fillStyle = '#ffffff'; for (let i = 0; i < 160; i++) { c.globalAlpha = 0.3 + 0.5 * ((i * 37) % 10) / 10; c.fillRect((i * 997) % w, ((i * 613) % (h * 0.45)), 2, 2); } c.globalAlpha = 1; }
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (const layer of [{ base: 0.62, col: st.name === 'day' ? '#56657a' : '#141826', maxH: 0.3 }, { base: 0.72, col: st.name === 'day' ? '#2f3846' : '#07080d', maxH: 0.42 }]) {
    let x = 0;
    while (x < w) {
      const bw = w * (0.025 + rnd() * 0.05), bh = h * (0.08 + rnd() * layer.maxH);
      const top = h * layer.base - bh + h * 0.28;
      c.fillStyle = layer.col; c.fillRect(x, top, bw, h - top);
      if (st.lit > 0.1) {
        for (let wy = top + 10; wy < h - 12; wy += 16) for (let wx = x + 6; wx < x + bw - 6; wx += 12)
          if (rnd() < st.lit * 0.5) { c.fillStyle = rnd() < 0.8 ? '#ffd58a' : '#cfe3ff'; c.fillRect(wx, wy, 5, 7); }
      }
      x += bw + w * 0.004;
    }
  }
}
function buildWindowView() {
  skyTex = canvasTex(2048, 720, drawSky);
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(18, 6.3), new THREE.MeshBasicMaterial({ map: skyTex, toneMapped: false }));
  sky.position.set(0, 2.0, -7.2); scene.add(sky);
  sun = new THREE.DirectionalLight(0xffffff, 1);
  sun.position.set(2, 4, -8); sun.target.position.set(0, 0, -1); scene.add(sun, sun.target);
  updateSky();
  setInterval(updateSky, 5 * 60 * 1000);
}
function updateSky() {
  repaint(skyTex, drawSky);
  const st = skyState(new Date().getHours());

const marker = new THREE.Group();

const lerp = (a, b, k) => a + (b - a) * k;
function animateDirectors(t, dt) {
  const cam = camera.getWorldPosition(V());
  const k = Math.min(1, dt * 5);
  const S = directors.find((x) => x.d.name === speaker);
  for (const D of directors) {
    const talking = D === S;
    const hx = D.g.position.x, hz = D.g.position.z;
    let lx = cam.x, lz = cam.z;
    if (S && !talking) { lx = S.g.position.x; lz = S.g.position.z + 0.3; }
    const yaw = THREE.MathUtils.clamp(Math.atan2(lx - hx, lz - hz), -1.0, 1.0);
    D.head.rotation.y = lerp(D.head.rotation.y, yaw * 0.75, k);
    D.hips.rotation.y = lerp(D.hips.rotation.y, yaw * 0.22, k);
    const ph = D.d.phase;
    D.nod = Math.max(0, D.nod - dt);
    const nod = D.nod > 0 ? 0.18 * Math.sin((1 - D.nod) * PI * 3) : 0;
    if (talking) {
      D.head.rotation.x = lerp(D.head.rotation.x, 0.05 * Math.sin(t * 4.7 + ph) + nod, k);
      for (const a of D.arms) {
        const o = a.side > 0 ? 0 : 1.9;
        a.sh.rotation.x = lerp(a.sh.rotation.x, -0.95 + 0.28 * Math.sin(t * 2.4 + o + ph), k);
        a.sh.rotation.z = lerp(a.sh.rotation.z, a.side * (0.2 + 0.14 * Math.sin(t * 1.7 + o)), k);
        a.el.rotation.x = lerp(a.el.rotation.x, -0.9 + 0.4 * Math.sin(t * 3.1 + o * 1.3), k);
      }
      D.visorMat.opacity = 0.5 + 0.5 * Math.abs(Math.sin(t * 11 + Math.sin(t * 3) * 2));
    } else {
      D.head.rotation.x = lerp(D.head.rotation.x, 0.02 * Math.sin(t * 0.8 + ph) + nod, k);
      for (const a of D.arms) {
        a.sh.rotation.x = lerp(a.sh.rotation.x, -0.7, k * 0.6);
        a.sh.rotation.z = lerp(a.sh.rotation.z, a.side * 0.08, k * 0.6);
        a.el.rotation.x = lerp(a.el.rotation.x, -0.85, k * 0.6);
      }
      D.visorMat.opacity = lerp(D.visorMat.opacity, 0.3, k);
    }
  }
  if (S) {
    const target = S.head.getWorldPosition(V()).add(new THREE.Vector3(0, 0.3 + 0.025 * Math.sin(t * 2.5), 0));
    if (!marker.visible) { marker.position.copy(target); marker.visible = true; }
    marker.position.lerp(target, Math.min(1, dt * 6));
    marker.rotation.y += dt * 1.6;
  } else marker.visible = false;
}

// ---------- placing / dropping ----------
function setWorldPos(obj, p) { obj.position.copy(obj.parent ? obj.parent.worldToLocal(p.clone()) : p); }
function overTable(p) { return p.x > TABLE.x0 && p.x < TABLE.x1 && p.z > TABLE.z0 && p.z < TABLE.z1 && p.y < TABLE.y + 0.6; }
function layFlat(obj, x, z, extraY = 0) {
  scene.attach(obj);
  obj.position.set(x, TABLE.y + 0.004 + extraY, z);
  obj.rotation.set(-PI / 2, 0, (Math.random() - 0.5) * 0.12);
}
function remember(obj, kind, info) { lastAction = { obj, kind, info }; }
function place(obj) {
  const p = obj.getWorldPosition(V());
  const ud = obj.userData;
  if (ud.kind === 'doc') {
    const prev = ud.doc.state;
    if (prev) { const t = trays.find((x) => x.kind === prev); if (t) t.count = Math.max(0, t.count - 1); setDocState(obj, null); }
    for (const t of trays) if (t.contains(p)) {
      layFlat(obj, t.x + (Math.random() - 0.5) * 0.03, t.z + (Math.random() - 0.5) * 0.02, 0.012 + t.count * 0.003);
      t.count++; t.flash = 1.2; setDocState(obj, t.kind); remember(obj, t.kind);
      if (t.kind === 'approve') showToast(`Approved: ${ud.doc.title}`, 'Preview only — not saved. Undo within a few seconds.');
      else showToast(`Sent back: ${ud.doc.title}`, 'Stage 2: your next spoken sentence becomes the revision note.');
      return;
    }
    for (const D of directors) {
      if (Math.abs(p.x - D.d.x) < 0.38 && p.z < TABLE.z0 + 0.12 && p.z > DIRECTOR_Z - 0.5 && p.y > 0.5 && p.y < 1.7) {
        layFlat(obj, D.d.x + (Math.random() - 0.5) * 0.05, -1.72, 0.002);
        setDocState(obj, `handed:${D.d.name}`); D.nod = 1; remember(obj, 'hand');
        showToast(`Handed to ${D.d.name}: ${ud.doc.title}`, 'Preview only — not sent yet.');
        return;
      }
    }
    if (overTable(p)) { layFlat(obj, p.x, p.z); return; }
    scene.attach(obj); obj.lookAt(camera.getWorldPosition(V()));
    return;
  }
  if (ud.kind === 'note') {
    const lp = board.worldToLocal(p.clone());
    if (Math.abs(lp.z) < 0.45 && Math.abs(lp.x) < 1.62 && Math.abs(lp.y) < 0.98) {
      board.attach(obj);
      obj.position.set(THREE.MathUtils.clamp(lp.x, -1.48, 1.48), THREE.MathUtils.clamp(lp.y, -0.82, 0.72), 0.012 + Math.random() * 0.002);
      obj.rotation.set(0, 0, (Math.random() - 0.5) * 0.08);
      return;
    }
    scene.attach(obj); obj.lookAt(camera.getWorldPosition(V()));
  }

const raycaster = new THREE.Raycaster();
const tmpMat = new THREE.Matrix4();
const controllers = [];
function setupXRInput() {
  const cmf = new XRControllerModelFactory();
  const hmf = new XRHandModelFactory();
  for (let i = 0; i < 2; i++) {
    const c = renderer.xr.getController(i);

      new THREE.LineBasicMaterial({ color: GOLD_HI, transparent: true, opacity: 0.75, toneMapped: false }));
    line.scale.z = 3; c.add(line);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.009, 12, 8), glowMat(GOLD_HI, 1)); dot.visible = false; scene.add(dot);

    rig.add(c);

    const hand = renderer.xr.getHand(i);

}
function pickFromController(c) {
  tmpMat.identity().extractRotation(c.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpMat);
  raycaster.far = 12;
  return firstHit(raycaster.intersectObjects(hitables, false));
}
function firstHit(list) {
  for (const h of list) {
    const o = h.object;
    if (!isShown(o)) continue;
    const owner = o.userData.owner;
    if (owner && owner.userData.heldBy) continue;
    return h;
  }
  return null;
}
function setGlow(obj, on) { if (obj && obj.userData.frame) obj.userData.frame.visible = on; }
function grab(obj, c) {
  if (obj.userData.heldBy && obj.userData.heldBy !== c) release(obj.userData.heldBy);
  c.attach(obj);
  obj.userData.heldBy = c; c.userData.held = obj; c.userData.pull = 0;
  obj.userData.pullFrom = { p: obj.position.clone(), q: obj.quaternion.clone() };
  setGlow(obj, true); hideToast();
}
const HOLD_P = new THREE.Vector3(0, 0.01, -0.2);
const HOLD_Q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.35, 0, 0));
function release(c) {
  const obj = c.userData.held; if (!obj) return;
  scene.attach(obj);
  obj.userData.heldBy = null; c.userData.held = null;
  setGlow(obj, false);
  place(obj);
}
function activate(hit) {
  const o = hit.object, kind = o.userData.kind;
  if (kind === 'button') { o.userData.onPress(); return null; }
  if (kind === 'ring') { teleport(o.userData.station); return null; }

}
function onSelectStart(e) {
  const c = e.target;
  const hit = pickFromController(c); if (!hit) return;
  const owner = activate(hit);
  if (owner) grab(owner, c);
}
function onSelectEnd(e) { release(e.target); }

// snap turn on either thumbstick
let snapCooldown = 0;
function snapTurn(a) {
  const before = camera.getWorldPosition(V());
  rig.rotation.y += a; rig.updateMatrixWorld(true);
  const after = camera.getWorldPosition(V());
  rig.position.x += before.x - after.x; rig.position.z += before.z - after.z;
}
function pollThumbsticks(dt) {
  snapCooldown = Math.max(0, snapCooldown - dt);
  const s = renderer.xr.getSession(); if (!s || snapCooldown > 0) return;
  for (const src of s.inputSources) {
    const gp = src.gamepad; if (!gp || !gp.axes) continue;
    const x = gp.axes.length >= 4 ? gp.axes[2] : gp.axes[0];
    if (Math.abs(x) > 0.7) { snapTurn(x > 0 ? -PI / 6 : PI / 6); snapCooldown = 0.35; return; }
  }
}

// ---------- phone / desktop input ----------
const ndc = new THREE.Vector2();
let drag = null;
function pointerHit(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera); raycaster.far = 40;
  return firstHit(raycaster.intersectObjects(hitables, false));
}
canvas.addEventListener('pointerdown', (e) => {
  if (renderer.xr.isPresenting) return;
  canvas.setPointerCapture(e.pointerId);
  const hit = pointerHit(e);
  drag = { x: e.clientX, y: e.clientY, moved: 0, hit, obj: null, plane: null };
  if (hit && (hit.object.userData.kind === 'doc' || hit.object.userData.kind === 'note')) {
    const obj = hit.object.userData.owner;
    drag.obj = obj; setGlow(obj, true); hideToast();
    const wp = obj.getWorldPosition(V());
    if (obj.userData.kind === 'note') {
      const n = new THREE.Vector3(0, 0, 1).applyQuaternion(board.getWorldQuaternion(new THREE.Quaternion()));
      drag.plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, board.getWorldPosition(V()).add(n.clone().multiplyScalar(0.03)));
    } else if (overTable(wp) || wp.y < TABLE.y + 0.3) {
      drag.plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(TABLE.y + 0.06));
      scene.attach(obj); obj.rotation.set(-PI / 2, 0, 0);
    } else {
      const n = camera.getWorldDirection(V()).negate();
      drag.plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, wp);
    }
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (renderer.xr.isPresenting) return;
  if (!drag) { const h = pointerHit(e); canvas.style.cursor = h ? 'pointer' : 'grab'; return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.obj) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const p = raycaster.ray.intersectPlane(drag.plane, V());
    if (p) setWorldPos(drag.obj, p);
  } else {
    lookYaw -= dx * 0.005; lookPitch = THREE.MathUtils.clamp(lookPitch - dy * 0.004, -1.2, 1.0);
    camera.rotation.set(lookPitch, lookYaw, 0);
  }
});
function endPointer() {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.obj) { setGlow(d.obj, false); place(d.obj); return; }
  if (d.moved < 8 && d.hit) activate(d.hit);
}

async function setupVRButton() {

});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- frame loop ----------
const clock = new THREE.Clock();
let hovered = new Set();
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  const presenting = renderer.xr.isPresenting;

  const newHover = new Set();
  if (presenting) {
    pollThumbsticks(dt);
    for (const c of controllers) {
      const u = c.userData;
      if (u.held) {
        u.pull = Math.min(1, u.pull + dt / 0.18);
        const k = u.pull * u.pull * (3 - 2 * u.pull);
        u.held.position.lerpVectors(u.held.userData.pullFrom.p, HOLD_P, k);
        u.held.quaternion.slerpQuaternions(u.held.userData.pullFrom.q, HOLD_Q, k);
        u.line.scale.z = 0.2; u.dot.visible = false; continue;
      }
      const hit = c.visible ? pickFromController(c) : null;
      if (hit) {
        u.line.scale.z = hit.distance; u.dot.position.copy(hit.point); u.dot.visible = true;
        newHover.add(hit.object);
      } else { u.line.scale.z = 3; u.dot.visible = false; }
    }
  }
  for (const o of hovered) if (!newHover.has(o)) {
    const k = o.userData.kind;
    if (k === 'button') o.scale.setScalar(1);
    if (k === 'ring') o.userData.ring.scale.setScalar(1);
    if (k === 'doc' || k === 'note') setGlow(o.userData.owner, !!o.userData.owner.userData.heldBy);
  }
  for (const o of newHover) {
    const k = o.userData.kind;
    if (k === 'button') o.scale.setScalar(1.08);
    if (k === 'ring') o.userData.ring.scale.setScalar(1.15);
    if (k === 'doc' || k === 'note') setGlow(o.userData.owner, true);
  }
  hovered = newHover;

  const holding = presenting && controllers.some((c) => c.userData.held);
  const fm = focusShell.material;
  fm.opacity = lerp(fm.opacity, holding ? 0.5 : 0, Math.min(1, dt * 6));
  focusShell.visible = fm.opacity > 0.01;

  for (const tr of trays) {
    tr.flash = Math.max(0, tr.flash - dt);
    tr.glow.material.opacity = 0.12 + 0.6 * Math.min(1, tr.flash);
  }
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) hideToast(); }
  toast3d.visible = presenting && toastTimer > 0;
  animateDirectors(t, dt);
  renderer.render(scene, camera);
  if (!window.__officeReady) { window.__officeReady = true; const b = $('#boot'); if (b) b.remove(); }
}

// ---------- headset sign-in with a phone code ----------
// The headset never sees a password. It asks for a short code, you approve that code on your
// signed-in phone (Hq/pair), and the headset receives its own Business HQ sign-in.
const PAIR_FN = 'https://whvgwshdppluudzkhcqp.supabase.co/functions/v1/hq-device-pair';
const PAIR_PAGE = 'workingbonesoutfitters.github.io/Hq/pair';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const session = () => { try { return JSON.parse(store.get('hq_sess')); } catch (e) { return null; } };
let pairing = null, pairTimer = null;
const pairPanel = labelPlane(0.7, 0.34, (c, w, h) => drawPair3d(c, w, h), { px: 1600 });
pairPanel.position.set(0, 1.5, -1.25); pairPanel.visible = false; scene.add(pairPanel);
function drawPair3d(c, w, h) {
  panelBg(c, w, h, { radius: 0.06 });
  c.textAlign = 'center'; c.fillStyle = '#c9bea4'; c.font = `500 ${h * 0.08}px ${SANS}`;
  c.fillText('Sign this headset in — on your phone open', w / 2, h * 0.17);
  c.fillStyle = '#f0e6cc'; c.font = `600 ${h * 0.075}px ${SANS}`; c.fillText(PAIR_PAGE, w / 2, h * 0.3);
  c.fillStyle = '#e6c878'; c.font = `700 ${h * 0.25}px ui-monospace, Menlo, monospace`;
  c.fillText(pairing ? pairing.code : '', w / 2, h * 0.66);
  c.fillStyle = '#a59f92'; c.font = `500 ${h * 0.065}px ${SANS}`; c.fillText('Enter that code and tap Approve. It works once and expires in 3 minutes.', w / 2, h * 0.88);
}
function deviceLabel() {
  const ua = navigator.userAgent || '';
  if (/OculusBrowser|Quest/i.test(ua)) return 'Meta Quest browser';
  if (/iPhone|iPad/i.test(ua)) return 'iPhone or iPad browser';
  return 'Web browser';
}
function updateAuthBadge() {
  const s = session(), b = $('#authBadge');
  b.textContent = s ? '✓ Headset signed in' : 'Sign in with phone code';
  b.classList.toggle('signed', !!s);
}
function showPairBox(html) { $('#pairBody').innerHTML = html; $('#pairBox').hidden = false; }
function closePairBox() { $('#pairBox').hidden = true; }
function stopPairing() { pairing = null; clearTimeout(pairTimer); pairPanel.visible = false; }
function pairCountdown() {
  if (!pairing) return;
  const left = Math.max(0, Math.round((pairing.until - Date.now()) / 1000));
  const el = $('#pairLeft'); if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
}
async function startPairing() {
  stopPairing();
  showPairBox('<h2>Getting a code…</h2>');
  try {
    const r = await fetch(PAIR_FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'start', label: deviceLabel() }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.code) throw new Error(j.error || 'Could not get a code');
    pairing = { code: j.code, secret: j.secret, until: Date.now() + (j.expires_in || 180) * 1000 };
  } catch (e) {
    return showPairBox(`<h2>Couldn't get a code</h2><p>${String(e.message || e).replace(/[<>&]/g, '')}</p><div class="row"><button id="pairRetry">Try again</button><button id="pairClose">Close</button></div>`), wirePairButtons();
  }
  repaint(pairPanel.userData.tex, drawPair3d); pairPanel.visible = true;
  showPairBox(`<h2>Sign this headset in</h2><p>On your phone, open</p><p class="url">${PAIR_PAGE}</p><p>and enter this code:</p><div class="code">${pairing.code}</div><p>Expires in <b id="pairLeft">3:00</b> · works once</p><div class="row"><button id="pairClose">Cancel</button></div>`);
  wirePairButtons(); pairCountdown(); pollPairing();
}
async function pollPairing() {
  if (!pairing) return;
  pairCountdown();
  if (Date.now() > pairing.until) {
    stopPairing();
    showPairBox('<h2>Code expired</h2><p>No problem — get a fresh one.</p><div class="row"><button id="pairRetry">New code</button><button id="pairClose">Close</button></div>');
    return wirePairButtons();
  }
  const p = pairing;
  try {
    const r = await fetch(PAIR_FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'claim', code: p.code, secret: p.secret }) });
    const j = await r.json().catch(() => ({}));
    if (pairing !== p) return;
    if (j.status === 'signed_in' && j.session) {
      if (!store.get('hq_url')) store.set('hq_url', j.url);
      if (!store.get('hq_key')) store.set('hq_key', j.key);
      store.set('hq_sess', JSON.stringify({ at: j.session.access_token, rt: j.session.refresh_token, em: 'Meta Quest headset (paired)' }));
      stopPairing(); updateAuthBadge();
      showPairBox('<h2>✓ Headset signed in</h2><p>This headset now has its own Business HQ sign-in. You can sign it out any time from here.</p><div class="row"><button id="pairClose">Done</button></div>');
      wirePairButtons(); showToast('Headset signed in', 'Paired with your phone. No password was typed.');
      return;
    }
    if (j.status === 'expired') { pairing.until = 0; }
  } catch (e) { /* keep trying until the code expires */ }
  pairTimer = setTimeout(pollPairing, 2500);
}
async function signOutHeadset() {
  const s = session(), U = store.get('hq_url'), K = store.get('hq_key');
  if (s && U && K) {
    try { await fetch(U + '/auth/v1/logout?scope=local', { method: 'POST', headers: { apikey: K, Authorization: 'Bearer ' + s.at } }); } catch (e) {}
  }
  store.del('hq_sess'); updateAuthBadge();
  showPairBox('<h2>Signed out</h2><p>This headset no longer has a Business HQ sign-in.</p><div class="row"><button id="pairClose">Close</button></div>');
  wirePairButtons();
}
function wirePairButtons() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('pairRetry', startPairing);
  on('pairClose', () => { stopPairing(); closePairBox(); });
  on('pairSignOut', signOutHeadset);
}
$('#authBadge').addEventListener('click', () => {
  if (session()) {
    showPairBox('<h2>Headset signed in</h2><p>Signed in through a phone code.</p><div class="row"><button id="pairSignOut">Sign out this headset</button><button id="pairClose">Close</button></div>');
    wirePairButtons();
  } else startPairing();
});
setInterval(pairCountdown, 1000);

// ---------- build ----------
buildRoom();
buildWindowView();
buildLights();
buildDesk();
makeTray('revise', -1.05, -0.85);
makeTray('approve', 1.05, -0.85);
DOCS.forEach((d, i) => makeDoc(d, i));
DIRECTORS.forEach(makeDirector);
buildConsole();
buildWelcome();
buildStations();
buildDock();
setupXRInput();
setupVRButton();
teleport(STATIONS[0]);
setSpeaker(null);
updateAuthBadge();
renderer.setAnimationLoop(frame);
</script>
</body>
</html>
