<style>
:root{--gold:#c9a24a;--gold2:#e6c878;--panel:rgba(12,12,14,.84);--line:rgba(201,162,74,.38);--text:#f3ede0;--muted:#a59f92}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050506;color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.badge{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text);text-decoration:none}
.badge b{color:var(--gold2);font-weight:600}
.badge.demo{background:var(--gold);border-color:var(--gold);color:#16120a;font-weight:700}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(820px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 4px;white-space:nowrap}
button{font:inherit;color:var(--text);background:#17171a;border:1px solid #2c2c31;border-radius:12px;padding:8px 12px;min-height:40px;white-space:nowrap;cursor:pointer}
button:hover{border-color:var(--gold)}
button.on{border-color:var(--gold);color:var(--gold2)}
button.vr{background:var(--gold);color:#16120a;border-color:var(--gold);font-weight:700}
button:disabled{opacity:.5;cursor:default}
.idea{display:flex;gap:6px}
.idea[hidden]{display:none}
.idea input{flex:1;min-width:0;font:inherit;color:var(--text);background:#111113;border:1px solid #2c2c31;border-radius:12px;padding:8px 12px}
.hint{font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:10px 10px 10px 16px;display:none;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast.show{display:flex}
.toast .t{font-weight:600}
.toast .s{font-size:12px;color:var(--muted)}
button.badge{min-height:0;cursor:pointer;font:inherit;font-size:13px}
button.badge.signed{border-color:var(--gold);color:var(--gold2)}
.pair{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.pair[hidden]{display:none}
.pairCard{background:#111113;border:1px solid var(--gold);border-radius:20px;padding:24px;width:100%;max-width:440px;text-align:center}
.pairCard h2{font:600 22px Georgia,serif;color:var(--gold2);margin:0 0 6px}
.pairCard p{color:var(--muted);margin:6px 0}
.pairCard .code{font:700 46px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--gold2);margin:14px 0 6px}
.pairCard .url{color:var(--text);font-weight:600;word-break:break-all}
.pairCard .row{justify-content:center;margin-top:14px}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#050506;color:var(--gold2);font:500 18px Georgia,serif;letter-spacing:.04em}
#boot small{display:block;margin-top:8px;color:var(--muted);font:13px -apple-system,Helvetica,Arial,sans-serif}
</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

// ================= constants =================
const $ = (s) => document.querySelector(s);
const PI = Math.PI;
const GOLD = 0xc9a24a, GOLD_HI = 0xf0d48a, COPPER = 0xe0794a;
const SERIF = "Georgia, 'Times New Roman', serif";
const SANS = "-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const V = () => new THREE.Vector3();
const clamp = THREE.MathUtils.clamp;
const lerp = (a, b, k) => a + (b - a) * k;

// Your desk: a curved arc wrapping around your chair at the origin, facing -z.
const DESK = { y: 0.74, r0: 0.52, r1: 1.55, half: 1.25 };
// The directors' crescent table across from you.
const BOARD_T = { y: 0.74, r0: 1.9, r1: 2.26, half: 0.6 };
const CHAIR_R = 2.72;
const polar = (r, a) => [r * Math.sin(a), -r * Math.cos(a)]; // angle 0 = straight ahead
const faceCenter = (x, z) => Math.atan2(-x, -z);            // yaw so +z faces you

const STATIONS = [
  { id: 'desk',       name: 'Executive Desk',      pos: [0, 0, 0],       yaw: 0,      eye: 1.2, pitch: -0.32 },
  { id: 'laser',      name: 'Laser Bench',         pos: [-4.9, 0, -3.2], yaw: PI / 2,  eye: 1.6, pitch: -0.45 },
  { id: 'book',       name: 'Book Stand',          pos: [-4.9, 0, 1.6],  yaw: PI / 2,  eye: 1.6, pitch: -0.35 },
  { id: 'apparel',    name: 'Apparel Corner',      pos: [4.9, 0, -3.2],  yaw: -PI / 2, eye: 1.6, pitch: -0.12 },
  { id: 'brainstorm', name: 'Brainstorm Wall',     pos: [5.0, 0, 1.8],   yaw: -PI / 2, eye: 1.6, pitch: 0 },
  { id: 'wall',       name: 'Sales & Pipeline',    pos: [0, 0, -3.7],    yaw: 0,      eye: 1.6, pitch: 0.05 },
];
const CREW = [
  { name: 'Claude', title: 'Development Director', ang: -0.4, phase: 0.0, role: 'engineer' },
  { name: 'Ava',    title: 'Executive Director',   ang: 0,    phase: 1.3, role: 'commander' },
  { name: 'Bob',    title: 'Marketing Director',   ang: 0.4,  phase: 2.6, role: 'pilot' },
];
// Business HQ names for each worker code.
const WHO = { chatgpt: 'Ava', claude: 'Claude', grok: 'Bob', owner: 'Michael' };
const CODE_OF = { Ava: 'chatgpt', Claude: 'claude', Bob: 'grok' };
const BIZ = { wb: 'WORKING BONES', fb: 'FUNNY BONES KIDS' };

// ================= renderer / scene =================
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
if (renderer.xr.setFoveation) renderer.xr.setFoveation(1);
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d1c2);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 40);
camera.rotation.order = 'YXZ';
const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);

// ================= materials =================
const std = (color, roughness, metalness, envMapIntensity = 0.35, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, envMapIntensity, ...extra });
const MAT = {
  floor: std(0x08080a, 0.16, 0.35, 0.9),
  wall: std(0xeee5d1, 0.9, 0.0, 0.3),
  ceiling: std(0xf6f1e8, 0.95, 0.0, 0.3),
  gold: std(GOLD, 0.24, 1.0, 1.1),
  bronze: std(0x5a4a2a, 0.35, 1.0, 0.7),
  glass: std(0x060608, 0.06, 0.7, 1.0),
  leather: std(0x141416, 0.55, 0.05, 0.3),
  bench: std(0x19191c, 0.6, 0.2, 0.4),
  form: std(0x2a2a2f, 0.5, 0.2, 0.5),
  paperBall: std(0xefe9dc, 0.95, 0.0, 0.2),
  noteBall: std(0xf1dc9c, 0.95, 0.0, 0.2),
};
const glowMat = (color, opacity = 1) =>
  new THREE.MeshBasicMaterial({ color, transparent: true, opacity, toneMapped: false, depthWrite: opacity >= 1 });
const ghostMat = new THREE.MeshBasicMaterial({ visible: false });
const decal = (m) => { m.polygonOffset = true; m.polygonOffsetFactor = -2; m.polygonOffsetUnits = -2; return m; };

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); parent.add(m); return m;
}

// ================= canvas helpers =================
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
function wrap(c, text, x, y, maxW, lh, maxLines = 6) {
  const words = String(text).split(/\s+/); let line = '', n = 0;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (c.measureText(t).width > maxW && line) { c.fillText(line, x, y); y += lh; line = w; if (++n >= maxLines) return y; }
    else line = t;
  }
  if (line) { c.fillText(line, x, y); y += lh; }
  return y;
}
function canvasTex(wPx, hPx, draw) {
  const cv = document.createElement('canvas');
  cv.width = Math.min(2048, Math.max(16, Math.round(wPx)));
  cv.height = Math.min(2048, Math.max(16, Math.round(hPx)));
  const ctx = cv.getContext('2d'); draw(ctx, cv.width, cv.height);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = maxAniso; tex.userData = { cv, ctx };
  return tex;
}
function repaint(tex, draw) { const { cv, ctx } = tex.userData; ctx.clearRect(0, 0, cv.width, cv.height); draw(ctx, cv.width, cv.height); tex.needsUpdate = true; }
function labelPlane(w, h, draw, { px = 1000, transparent = true, side = THREE.FrontSide } = {}) {
  const tex = canvasTex(w * px, h * px, draw);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent, toneMapped: false, side });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.userData.tex = tex; return m;
}
function panelBg(c, w, h, { fill = 'rgba(10,10,12,0.9)', stroke = '#c9a24a', radius = 0.08 } = {}) {
  const r = Math.min(w, h) * radius, lw = Math.max(3, h * 0.02);
  rr(c, lw, lw, w - lw * 2, h - lw * 2, r); c.fillStyle = fill; c.fill(); c.strokeStyle = stroke; c.lineWidth = lw; c.stroke();
}
function sprite(text) {
  const tex = canvasTex(1024, 256, (c, w, h) => {
    panelBg(c, w, h, { radius: 0.3 }); c.textAlign = 'center'; c.fillStyle = '#e6c878';
    c.font = `600 96px ${SERIF}`; c.fillText(text, w / 2, h * 0.62);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, toneMapped: false, transparent: true, depthWrite: false }));
  s.scale.set(1.15, 0.29, 1); return s;
}

// ================= interaction registry =================
const hitables = [];
function register(mesh, kind, owner, extra = {}) {
  mesh.userData.kind = kind; mesh.userData.owner = owner; Object.assign(mesh.userData, extra);
  hitables.push(mesh); return mesh;
}
function isShown(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function makeButton(w, h, text, onPress, { parent = scene } = {}) {
  const draw = (c, W, H, on) => {
    panelBg(c, W, H, { fill: on ? '#c9a24a' : 'rgba(18,18,21,0.95)', radius: 0.25 });
    c.textAlign = 'center'; c.fillStyle = on ? '#16120a' : '#f0e6cc';
    c.font = `600 ${H * 0.42}px ${SANS}`; c.fillText(text, W / 2, H * 0.64);
  };
  const m = labelPlane(w, h, (c, W, H) => draw(c, W, H, false), { px: 2000 });
  m.userData.setOn = (on) => repaint(m.userData.tex, (c, W, H) => draw(c, W, H, on));
  parent.add(m);
  return register(m, 'button', m, { onPress });
}

// Drop targets you can point at while holding something (directors, boxes, trash, board).
const targets = [];
function addTarget(mesh, kind, ref) { mesh.userData.target = { kind, ref }; targets.push(mesh); return mesh; }

// ================= room =================
function buildRoom() {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 11), MAT.floor);
  floor.rotation.x = -PI / 2; floor.position.set(0, 0, -0.5); scene.add(floor);
  // gold inlay circle around the meeting area
  const inlay = new THREE.Mesh(new THREE.RingGeometry(2.96, 2.99, 96), decal(glowMat(GOLD, 0.9)));
  inlay.rotation.x = -PI / 2; inlay.position.set(0, 0.002, -1.0); scene.add(inlay);

  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(14, 11), MAT.ceiling);
  ceil.rotation.x = PI / 2; ceil.position.set(0, 3.4, -0.5); scene.add(ceil);
  const wallL = new THREE.Mesh(new THREE.PlaneGeometry(11, 3.4), MAT.wall);
  wallL.rotation.y = PI / 2; wallL.position.set(-7, 1.7, -0.5); scene.add(wallL);
  const wallR = new THREE.Mesh(new THREE.PlaneGeometry(11, 3.4), MAT.wall);
  wallR.rotation.y = -PI / 2; wallR.position.set(7, 1.7, -0.5); scene.add(wallR);
  const wallFar = new THREE.Mesh(new THREE.PlaneGeometry(14, 3.4), MAT.wall);
  wallFar.position.set(0, 1.7, -6); scene.add(wallFar);

  // floor-to-ceiling windows behind your chair (z = +5)
  box(14, 0.32, 0.14, MAT.wall, 0, 0.16, 5);
  box(14, 0.22, 0.14, MAT.wall, 0, 3.29, 5);
  box(1.0, 3.4, 0.14, MAT.wall, -6.5, 1.7, 5);
  box(1.0, 3.4, 0.14, MAT.wall, 6.5, 1.7, 5);
  box(12.02, 0.015, 0.17, MAT.gold, 0, 0.33, 5);
  box(12.02, 0.015, 0.17, MAT.gold, 0, 3.17, 5);
  for (let x = -6; x <= 6; x += 2) box(0.06, 2.86, 0.1, MAT.bronze, x, 1.75, 5);

  // gold reveals + glowing sci-fi lines in the cream walls
  for (const z of [-4, -1, 2]) { box(0.012, 3.0, 0.012, MAT.gold, -6.985, 1.6, z); box(0.012, 3.0, 0.012, MAT.gold, 6.985, 1.6, z); }
  const line = glowMat(0xf2c66a, 0.85);
  for (const y of [1.05, 2.75]) {
    box(0.01, 0.012, 10.6, line, -6.985, y, -0.5); box(0.01, 0.012, 10.6, line, 6.985, y, -0.5);
    box(13.6, 0.012, 0.01, line, 0, y, -5.985);
  }
  box(0.02, 0.02, 11, MAT.gold, -6.98, 0.12, -0.5); box(0.02, 0.02, 11, MAT.gold, 6.98, 0.12, -0.5);
  box(14, 0.02, 0.02, MAT.gold, 0, 0.12, -5.98);

  // ceiling cove light + downlights
  const cove = glowMat(0xffd28a, 0.9);
  box(13.6, 0.02, 0.05, cove, 0, 3.37, 4.75); box(13.6, 0.02, 0.05, cove, 0, 3.37, -5.75);
  box(0.05, 0.02, 10.4, cove, -6.75, 3.37, -0.5); box(0.05, 0.02, 10.4, cove, 6.75, 3.37, -0.5);
  const dl = glowMat(0xfff0d0, 1);
  for (const [x, z] of [[-1, -1.3], [0, -1.3], [1, -1.3], [-5.5, -3.2], [-5.5, 1.6], [5.5, -3.2], [5.6, 1.8], [-1.5, -4.6], [1.5, -4.6]]) {
    const d = new THREE.Mesh(new THREE.CircleGeometry(0.07, 20), dl); d.rotation.x = PI / 2; d.position.set(x, 3.395, z); scene.add(d);
  }
}

// ================= living window (behind you) =================
let skyTex, sun;
const ships = [];
function skyState(hour) {
  if (hour < 5 || hour >= 21) return { name: 'night', g: ['#02030a', '#0a1026', '#1d1b2e'], lit: 0.85, sun: 0x5566aa, si: 0.3, orb: '#e8e6d8', orbY: 0.22 };
  if (hour < 8) return { name: 'dawn', g: ['#1c2a4c', '#b98572', '#f3c48d'], lit: 0.35, sun: 0xffc48a, si: 0.9, orb: '#ffd9a0', orbY: 0.62 };
  if (hour < 17) return { name: 'day', g: ['#2c6bb2', '#7fb0de', '#dbe7ef'], lit: 0.05, sun: 0xfff2dd, si: 1.3, orb: '#fffbe8', orbY: 0.18 };
  return { name: 'dusk', g: ['#1a1938', '#9c4e69', '#f2a35c'], lit: 0.6, sun: 0xffa86a, si: 0.8, orb: '#ffcf8a', orbY: 0.6 };
}
function drawSky(c, w, h) {
  const st = skyState(new Date().getHours());
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, st.g[0]); g.addColorStop(0.62, st.g[1]); g.addColorStop(1, st.g[2]);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = st.orb; c.globalAlpha = 0.9; c.beginPath(); c.arc(w * 0.3, h * st.orbY, h * 0.05, 0, PI * 2); c.fill(); c.globalAlpha = 1;
  if (st.name === 'night') { c.fillStyle = '#ffffff'; for (let i = 0; i < 160; i++) { c.globalAlpha = 0.3 + 0.5 * ((i * 37) % 10) / 10; c.fillRect((i * 997) % w, (i * 613) % (h * 0.45), 2, 2); } c.globalAlpha = 1; }
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (const layer of [{ base: 0.62, col: st.name === 'day' ? '#56657a' : '#141826', maxH: 0.3 }, { base: 0.72, col: st.name === 'day' ? '#2f3846' : '#07080d', maxH: 0.42 }]) {
    let x = 0;
    while (x < w) {
      const bw = w * (0.025 + rnd() * 0.05), bh = h * (0.08 + rnd() * layer.maxH), top = h * layer.base - bh + h * 0.28;
      c.fillStyle = layer.col; c.fillRect(x, top, bw, h - top);
      if (rnd() < 0.18) { c.fillStyle = layer.col; c.fillRect(x + bw * 0.45, top - h * 0.06, bw * 0.1, h * 0.06); c.fillStyle = '#ff6a4a'; c.fillRect(x + bw * 0.45, top - h * 0.065, bw * 0.1, 4); }
      if (st.lit > 0.1) for (let wy = top + 10; wy < h - 12; wy += 16) for (let wx = x + 6; wx < x + bw - 6; wx += 12)
        if (rnd() < st.lit * 0.5) { c.fillStyle = rnd() < 0.8 ? '#ffd58a' : '#cfe3ff'; c.fillRect(wx, wy, 5, 7); }
      x += bw + w * 0.004;
    }
  }
}
function buildWindowView() {
  skyTex = canvasTex(2048, 720, drawSky);
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(18, 6.3), new THREE.MeshBasicMaterial({ map: skyTex, toneMapped: false }));
  sky.rotation.y = PI; sky.position.set(0, 2.0, 6.4); scene.add(sky);
  sun = new THREE.DirectionalLight(0xffffff, 1);

function arcSlab(r0, r1, half, y, thick, mat) {

  sh.absarc(0, 0, r0, e, s, true);
  sh.closePath();
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: thick, bevelEnabled: false, curveSegments: 48 }), mat);
  m.rotation.x = -PI / 2; m.position.y = y - thick; scene.add(m); return m;
}
function arcTrim(r, half, y) {
  const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.0075, 8, 96, half * 2), MAT.gold);

}
function buildDesk(T, withChair) {

    const cap = box(0.015, 0.015, T.r1 - T.r0 + 0.03, MAT.gold, x, T.y - 0.02, z);
    cap.rotation.y = -a; cap.position.x += sgn * 0.009 * Math.cos(a); cap.position.z += sgn * 0.009 * Math.sin(a);
  }

    std(0x141416, 0.55, 0.05, 0.3, { side: THREE.DoubleSide }));
  panel.position.y = (T.y - 0.08) / 2 + 0.02; scene.add(panel);
  for (const a of [-T.half * 0.85, 0, T.half * 0.85]) {
    const [x, z] = polar(T.r0 + 0.06, a);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, T.y - 0.05, 12), MAT.gold);
    post.position.set(x, (T.y - 0.05) / 2, z); scene.add(post);

  const k = hit && hit.object.userData.kind;
  if (k === 'spinner') { drag.spin = apparel.spin; apparel.autoSpin = false; }
  if (k === 'doc' || k === 'note' || k === 'design' || k === 'proof') {
    const obj = hit.object.userData.owner; obj.userData.fly = obj.userData.glide = null; clearState(obj);
    drag.obj = obj; setGlow(obj, true); hideToast();

    if (u.glide) {

      obj.position.lerpVectors(g.from, g.to, k); obj.position.y += Math.sin(PI * k) * 0.25 * g.from.distanceTo(g.to) * 0.3;
      if (g.t >= 1) finishGlide(obj, g);
    } else if (u.fly) stepFlight(obj, dt);
  }
  for (const tr of trays) { tr.flash = Math.max(0, tr.flash - dt); tr.glow.material.opacity = 0.12 + 0.6 * Math.min(1, tr.flash); }
  trash.flash = Math.max(0, trash.flash - dt); trash.glow.material.opacity = 0.9 * Math.min(1, trash.flash);
  for (const s of ships) { s.position.x += s.userData.speed * s.userData.dir * dt; if (Math.abs(s.position.x) > 9.5) s.position.x = -9.5 * s.userData.dir; }
  if (holoScan) holoScan.material.map.offset.y = (t * 0.06) % 1;
  if (apparel.autoSpin) apparel.spin += dt * 0.7;
  if (apparel.shirt) apparel.shirt.rotation.y = lerp(apparel.shirt.rotation.y, apparel.spin, Math.min(1, dt * 4));
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) hideToast(); }
  toast3d.visible = presenting && toastTimer > 0;
  animateCrew(t, dt);
  renderer.render(scene, camera);
  if (!window.__officeReady) { window.__officeReady = true; const b = $('#boot'); if (b) b.remove(); }
}
