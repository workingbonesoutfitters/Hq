<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://*.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Business HQ">
<title>Business HQ v0.5.1</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ln:#e2dfd6;--ac:#c2410c;--ok:#15803d;--wa:#b45309;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#f1efe8;--mu:#a09e95;--ln:#33322e;--ac:#fb923c;--ok:#4ade80;--wa:#fbbf24;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#f1efe8;--mu:#a09e95;--ln:#33322e;--ac:#fb923c;--ok:#4ade80;--wa:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:84px}
header{padding:12px 14px 6px}h1{font-size:18px;margin:0}h2{font-size:15px;margin:16px 0 8px}small,.mu{color:var(--mu);font-size:13px}
main{padding:8px 14px;max-width:640px;margin:auto}.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);margin-right:4px}
.g{color:var(--ok);border-color:var(--ok)}.w{color:var(--wa);border-color:var(--wa)}.r{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;justify-content:space-between}
button{font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.ok{color:var(--ok);border-color:var(--ok)}.no{color:var(--bad);border-color:var(--bad)}
label{display:block;font-size:13px;color:var(--mu);margin-top:8px}input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);margin-top:3px}
.warn{border:1px dashed var(--wa);border-radius:12px;padding:10px;font-size:13px;margin-bottom:10px}.err{color:var(--bad);font-size:13px;margin-top:6px;white-space:pre-wrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;padding:12px 0;color:var(--mu)}nav .on{color:var(--ac);font-weight:700}
</style></head><body>
<header><h1>Business HQ <small>v0.5.1 · Supabase</small></h1></header>
<main id="app"></main><nav id="nav"></nav>
<script>
"use strict";
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let U=LS.get("hq_url")||"",K=LS.get("hq_key")||"",S=null;try{S=JSON.parse(LS.get("hq_sess"))}catch(e){}
let tab="tasks",biz="",D={tasks:[],apprs:[],rules:[],req:[],mem:[]},msg="",tests=null,form=false,busy=false,doc=null,lerr="";
const BN={wb:"Working Bones Outfitters",fb:"Funny Bones Kids"};
function badKey(k){if(/^sb_secret_/.test(k))return"That is a SECRET key. Never use it here.";const p=k.split(".");if(p.length==3){try{const j=JSON.parse(atob(p[1].replace(/-/g,"+").replace(/_/g,"/")));if(j.role&&j.role!="anon")return"That key has the role "+j.role+". Only the publishable (anon) key is allowed."}catch(e){}}return/^sb_publishable_/.test(k)||p.length==3?"":"That doesn’t look like a publishable key (it should start with sb_publishable_)."}
async function call(path,o={},retry=true){const h={apikey:K,"Content-Type":"application/json"};if(S&&!o.anon)h.Authorization="Bearer "+S.at;
const r=await fetch(U+path,{method:o.method||"GET",headers:{...h,...(o.headers||{})},body:o.body?JSON.stringify(o.body):undefined});
if(r.status==401&&S&&retry&&!o.anon&&await refresh())return call(path,o,false);
let j=null;try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,j}}
async function refresh(){if(!S)return false;const r=await fetch(U+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.rt})});if(!r.ok){S=null;LS.del("hq_sess");return false}const j=await r.json();S={at:j.access_token,rt:j.refresh_token,em:S.em};LS.set("hq_sess",JSON.stringify(S));return true}
const rpc=(n,b)=>call("/rest/v1/rpc/"+n,{method:"POST",body:b});
const err=r=>r.j&&(r.j.message||r.j.msg||r.j.error_description)||("HTTP "+r.status);
async function load(){if(!S)return;const[a,b,c,d,e]=await Promise.all([call("/rest/v1/tasks?select=*&order=created_at.desc&limit=200"),call("/rest/v1/approvals?select=*&decision=eq.pending&order=created_at.desc"),call("/rest/v1/approval_rules?select=*"),call("/rest/v1/publish_requires?select=*"),call("/rest/v1/memberships?select=business,role")]);
if(!a.ok){lerr="HTTP "+a.status+(a.j&&a.j.code?" ("+a.j.code+")":"")+": "+err(a)+(a.status==404?" The database tables are missing: the SQL setup has not completed in this project.":(a.status==401||a.status==403)?" You are signed in, but the database refused access. The SQL setup may be incomplete, or the session expired. Run the Tests tab.":"");render();return}lerr="";
D={tasks:a.j,apprs:b.ok?b.j:[],rules:c.ok?c.j:[],req:d.ok?d.j:[],mem:e.ok?e.j:[]};if(!biz||!D.mem.find(m=>m.business==biz))biz=(D.mem[0]||{}).business||"";render()}
const owner=()=>!!D.mem.find(m=>m.business==biz&&m.role=="owner");
function nav(){$("#nav").innerHTML=(S?[["tasks","Tasks"],["appr","Approve"+(D.apprs.length?" ("+D.apprs.length+")":"")],["bk","Backup"],["tst","Tests"],["acct","Account"]]:[]).map(([k,l])=>`<button data-a="tab|${k}" class="${tab==k?"on":""}">${l}</button>`).join("")}
const chip=(t,c)=>`<span class="chip ${c||""}">${esc(t)}</span>`;
function setup(){return`<div class="card"><b>Connect to your Supabase project</b><div class="warn">Paste only the <b>Project URL</b> and the <b>publishable</b> key. Never paste the secret or service_role key here or in any chat.</div><label>Project URL<input id="u" placeholder="https://xxxx.supabase.co" value="${esc(U)}"></label><label>Publishable key<input id="k" placeholder="sb_publishable_..." value="${esc(K)}"></label><div class="row"><button class="pri" data-a="cfg|">Save</button></div><div class="err">${esc(msg)}</div></div>`}
const DOC=()=>doc?doc.map(t=>`<div class="card"><b>${esc(t[0])}</b> ${chip(t[1],t[1]=="PASS"?"g":t[1]=="FAIL"?"r":"w")}<br><small>${esc(t[2])}</small></div>`).join(""):"";
function login(){return`<div class="card"><b>Owner sign-in</b><label>Email<input id="em" type="email" autocomplete="username"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><div class="row"><button class="pri" data-a="login|">Sign in</button><button data-a="doctor|">Run connection check</button></div><div class="err">${esc(msg)}</div><div class="row"><button data-a="reset|">Change project or key</button></div><small>Your password is sent only to your Supabase project and is never stored by this page. The connection check never shows your key.</small></div>`+DOC()}
function loginMsg(r){const c=(r.j&&(r.j.error_code||r.j.code))||"";let h="";
if(c=="invalid_credentials")h="The email or password does not match a user in THIS project. Check Authentication, Users in the same project, or set a new password there.";
else if(c=="email_not_confirmed")h="This user’s email is not confirmed. Open the user in Authentication, Users and confirm it.";
else if(r.status==429||c=="over_request_rate_limit")h="Too many attempts. Wait a few minutes and try again.";
else if(r.status==401||/api key/i.test(err(r)))h="The project rejected the key. Run the connection check, then use Change project or key.";
return"Sign-in failed (HTTP "+r.status+(c?", "+c:"")+"): "+err(r)+(h?"\n"+h:"")}
async function doctor(){const R=[],T=(n,s,d)=>R.push([n,s,d]);doc=R;const kb=badKey(K);
T("Key type",kb?"FAIL":"PASS",kb||"Publishable key format accepted. The key itself is never shown.");
T("Project address","INFO",U.replace("https://","")+" (the part before .supabase.co must match the project you created the user in)");
let r,j=null;try{r=await fetch(U+"/auth/v1/settings",{headers:{apikey:K}})}catch(e){T("Project reachable","FAIL","Could not reach this address. The project URL is wrong, or the project is paused.");return}
try{j=await r.json()}catch(e){}
if(r.status==401||r.status==403){T("Project accepts this key","FAIL","HTTP "+r.status+": "+((j&&(j.message||j.msg))||"rejected")+". The key does not belong to this project, or was copied incorrectly.");return}
if(!r.ok){T("Project reachable","FAIL","HTTP "+r.status);return}
T("Project accepts this key","PASS","Project reachable and key accepted.");
T("Email and password sign-in enabled",j&&j.external&&j.external.email?"PASS":"FAIL",j&&j.external&&j.external.email?"Enabled.":"Turn on the Email provider in Authentication.");
T("Public sign-ups disabled",j&&j.disable_signup?"PASS":"WARN",j&&j.disable_signup?"Only users you create can sign in.":"Anyone could try to create an account. Turn sign-ups off.");
let q=null,qj=null;try{q=await fetch(U+"/rest/v1/approval_rules?select=action&limit=1",{headers:{apikey:K}});try{qj=await q.json()}catch(e){}}catch(e){}
if(!q)T("Database check","WARN","Request failed.");
else if(q.status==404)T("Database tables installed","FAIL","Not found ("+((qj&&qj.code)||"404")+"). The SQL setup script has not completed in this project.");
else if(q.status==401||q.status==403)T("Database installed and locked","PASS","Tables exist and are not readable by signed-out visitors (expected).");
else if(q.ok)T("Database locked to signed-out visitors","FAIL","Readable without signing in. Do not store data until this is fixed.");
else T("Database check","WARN","HTTP "+q.status)}
const BIZ=()=>D.mem.length?`<div class="row" style="margin:0 0 8px">${D.mem.map(m=>`<button data-a="biz|${m.business}" class="${biz==m.business?"pri":""}">${BN[m.business]||m.business}</button>`).join("")}</div>`:`<div class="warn">You are signed in, but not a member of any business yet. Add your memberships in the Supabase SQL editor (see the setup guide).</div>`;
function tasks(){const L=D.tasks.filter(t=>t.business==biz);const kinds=[...new Set(D.rules.map(r=>r.kind))];
const f=form&&owner()?`<div class="card"><b>New task</b><label>Title<input id="n_t"></label><label>Instructions<textarea id="n_i" rows="3"></textarea></label><label>Department<input id="n_d" value="general"></label><label>Assign to<select id="n_w"><option value="claude">Claude</option><option value="chatgpt">ChatGPT</option><option value="grok">Grok</option></select></label><label>Category<select id="n_k" data-a="kind|">${kinds.map(k=>`<option>${k}</option>`).join("")}</select></label><label>Action<select id="n_a" data-a="act|">${acts(kinds[0])}</select></label><label>Reference (design or product id, e.g. design:cover-v1)<input id="n_r"></label><label id="n_dl" style="display:none">Depends on (completed review)<select id="n_p"></select></label><label>Estimated cost ($)<input id="n_c" type="number" step="0.01" value="0"></label><small>Design review and publication are separate tasks. Approving a design never publishes.</small><div class="row"><button class="pri" data-a="create|">Create</button><button data-a="form|">Cancel</button></div><div class="err">${esc(msg)}</div></div>`:"";
return BIZ()+`<div class="row" style="margin:0 0 8px"><h2 style="margin:0">Tasks</h2>${owner()?`<button class="pri" data-a="form|">+ New</button>`:""}</div>${f}`+(L.length?L.map(t=>`<div class="card"><b>${esc(t.title)}</b><div style="margin-top:4px">${chip(t.worker,"")}${chip(t.status,t.status=="done"?"g":t.status=="failed"?"r":t.status=="awaiting_approval"?"w":"")}${chip(t.kind+" / "+t.action,"w")}${chip(t.mode)}${t.requires_approval?chip("approval needed","w"):""}</div><small>Attempts ${t.attempts}/${t.max_attempts} · cost $${t.actual_cost} (est. $${t.est_cost})${t.last_error?" · "+esc(t.last_error):""}</small>${["queued","awaiting_approval","approved"].includes(t.status)&&owner()?`<div class="row" style="justify-content:flex-start"><button class="no" data-a="cancel|${t.id}">Cancel task</button></div>`:""}</div>`).join(""):`<div class="card mu">No tasks for this business.</div>`)}
const acts=k=>D.rules.filter(r=>r.kind==k).map(r=>`<option>${r.action}</option>`).join("");
function appr(){const L=D.apprs.filter(a=>a.business==biz);return BIZ()+`<h2 style="margin-top:0">Approve</h2><div class="warn">Approving records your decision. Nothing is published, bought or changed automatically. Each approval is for one exact action, works once, and expires after 7 days.</div>`+(L.length?L.map(a=>{const t=D.tasks.find(x=>x.id==a.task_id)||{};const del=a.kind=="deletion",ph="DELETE "+a.id.slice(0,8);return`<div class="card"><b>${esc(t.title||"Task")}</b><div style="margin-top:4px">${chip(a.kind,"w")}${chip(a.action)}${a.action.startsWith("approve_")?chip("DESIGN/MANUSCRIPT REVIEW only","g"):chip("consequential","r")}</div><small>Expires ${new Date(a.expires_at).toLocaleDateString()}${a.est_cost>0?" · est. $"+a.est_cost:""}</small>${t.payload?`<div style="font-size:13px;margin-top:4px">${esc(JSON.stringify(t.payload))}</div>`:""}${del?`<label>Type <b>${ph}</b> to confirm<input id="cf_${a.id}"></label>`:""}<div class="row"><button class="ok" data-a="dec|${a.id}|approved">Approve</button><button class="no" data-a="dec|${a.id}|rejected">Reject</button></div></div>`}).join(""):`<div class="card mu">Nothing waiting for you.</div>`)+`<div class="err">${esc(msg)}</div>`}
function bk(){const lb=LS.get("hq_lastbk"),old=!lb||(Date.now()-+lb)>30*864e5;return`<h2 style="margin-top:0">Backup</h2><div class="card"><b>Download a full backup</b><p class="mu" style="font-size:13px">Saves every task, output, history event and approval you can access as a JSON file. Save it to Files or iCloud Drive.</p><div class="row"><button class="pri" data-a="export|">Download backup</button></div><div class="${old?"err":"mu"}" style="margin-top:8px;font-size:13px">${lb?"Last backup from this device: "+new Date(+lb).toLocaleDateString():"No backup downloaded from this device yet."}${old?" Back up now, then monthly.":""}</div><div class="err">${esc(msg)}</div></div><div class="card"><small>Free Supabase projects have no daily backups. Restoring from this file is not built yet.</small></div>`}
function tst(){return`<h2 style="margin-top:0">Live security checks</h2><div class="warn">These run against YOUR real project from this phone. They check the live database permissions. They do not replace the SQL self-test.</div><div class="row" style="margin:0 0 8px"><button class="pri" data-a="runtests|">${busy?"Running…":"Run checks"}</button></div>`+(tests?tests.map(t=>`<div class="card"><b>${esc(t[0])}</b> ${chip(t[1],t[1]=="PASS"?"g":t[1]=="FAIL"?"r":"w")}<br><small>${esc(t[2])}</small></div>`).join(""):"")}
function acct(){return`<h2 style="margin-top:0">Account</h2><div class="card">Signed in as <b>${esc(S.em)}</b><div class="row"><button class="no" data-a="logout|">Sign out</button><button data-a="reset|">Change project</button></div></div><div class="card"><small>Sync: this page re-reads the database every 5 seconds while open (polling, not live push). To add to the Home Screen: Share, then Add to Home Screen.</small></div>`}
function render(){nav();const a=$("#app");if(!U||!K||badKey(K)){a.innerHTML=setup();return}if(!S){a.innerHTML=login();return}a.innerHTML=(lerr?`<div class="warn" style="border-color:var(--bad)"><b>Problem loading data:</b> ${esc(lerr)}</div>`:"")+({tasks,appr,bk,tst,acct})[tab==="appr"?"appr":tab==="bk"?"bk":tab==="tst"?"tst":tab==="acct"?"acct":"tasks"]();if(tab=="tasks"&&form)deps()}
function deps(){const k=$("#n_k"),a=$("#n_a"),p=$("#n_p");if(!k||!a)return;const r=D.req.find(x=>x.action==a.value);$("#n_dl").style.display=r?"block":"none";if(r)p.innerHTML=D.tasks.filter(t=>t.business==biz&&t.action==r.requires_action&&t.status=="done").map(t=>`<option value="${t.id}">${esc(t.title)} (${esc((t.payload||{}).ref||"")})</option>`).join("")||`<option value="">No completed review yet</option>`}
async function onclick(e){const t=e.target.closest("[data-a]");if(!t||t.tagName=="SELECT")return;const[a,x,y]=t.dataset.a.split("|");msg="";
try{
if(a=="tab"){tab=x}else if(a=="biz"){biz=x}else if(a=="form"){form=!form}
else if(a=="cfg"){const u=$("#u").value.trim().replace(/\/$/,""),k=$("#k").value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u)){msg="Project URL should look like https://abcd.supabase.co";return render(msg)}const b=badKey(k);if(b){msg=b;K="";return render()}U=u;K=k;LS.set("hq_url",U);LS.set("hq_key",K)}
else if(a=="login"){const em=$("#em").value.trim(),pw=$("#pw").value;const r=await call("/auth/v1/token?grant_type=password",{method:"POST",body:{email:em,password:pw},anon:true});if(!r.ok){msg=loginMsg(r)}else{S={at:r.j.access_token,rt:r.j.refresh_token,em};LS.set("hq_sess",JSON.stringify(S));await load()}}
else if(a=="doctor"){await doctor()}
else if(a=="logout"){S=null;LS.del("hq_sess");D={tasks:[],apprs:[],rules:[],req:[],mem:[]}}
else if(a=="reset"){doc=null;S=null;LS.del("hq_sess");LS.del("hq_url");LS.del("hq_key");U="";K=""}
else if(a=="create"){const g=i=>$("#n_"+i).value.trim();if(!g("t")){msg="Add a title";return render()}const ref=g("r");const body={p_business:biz,p_department:g("d")||"general",p_title:g("t"),p_instructions:g("i"),p_inputs:{},p_worker:g("w"),p_kind:g("k"),p_action:g("a"),p_payload:ref?{ref}:{},p_est_cost:parseFloat(g("c"))||0,p_mode:"manual_relay"};const p=g("p");if($("#n_dl").style.display!="none")body.p_depends_on=p||null;const r=await rpc("create_task",body);if(!r.ok)msg=err(r);else{form=false;await load()}}
else if(a=="cancel"){const r=await rpc("cancel_task",{p_task:x});if(!r.ok)msg=err(r);else await load()}
else if(a=="dec"){const c=$("#cf_"+x);const r=await rpc("decide_approval",{p_id:x,p_decision:y,p_confirm:c?c.value.trim():null});if(!r.ok)msg=err(r);else await load()}
else if(a=="export"){const r=await rpc("export_all",{});if(!r.ok)msg=err(r);else{const f=new File([JSON.stringify(r.j,null,1)],"hq-backup-"+new Date().toISOString().slice(0,10)+".json",{type:"application/json"});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]})}else throw 0}catch(z){const u=URL.createObjectURL(f),l=document.createElement("a");l.href=u;l.download=f.name;document.body.appendChild(l);l.click();l.remove()}LS.set("hq_lastbk",String(Date.now()));msg="Backup created ("+(r.j.tasks||[]).length+" tasks)."}}
else if(a=="runtests"){await runtests();return}
}catch(z){if(z&&z.name!="AbortError")msg="Error: "+(z.message||z)}render()}
async function runtests(){busy=true;tests=[];render();const T=(n,s,d)=>tests.push([n,s,d]);
T("Key is publishable, not secret",badKey(K)?"FAIL":"PASS","Only the browser-safe key is stored here.");
let r=await fetch(U+"/rest/v1/tasks?select=id",{headers:{apikey:K}});let j=null;try{j=await r.json()}catch(e){}
T("Signed-out visitors cannot read tasks",(!r.ok||(Array.isArray(j)&&!j.length))?"PASS":"FAIL","HTTP "+r.status);
r=await call("/rest/v1/tasks?select=id&limit=1");T("Signed-in owner can read tasks",r.ok?"PASS":"FAIL","HTTP "+r.status);
r=await call("/rest/v1/tasks",{method:"POST",body:{business:biz||"wb",title:"SECURITY TEST",worker:"claude",kind:"internal",action:"research"}});T("Direct insert into tasks is blocked",(r.status==401||r.status==403)?"PASS":"FAIL","HTTP "+r.status+(r.ok?" (a stray test row may exist; cancel it)":""));
r=await call("/rest/v1/approvals?id=eq.00000000-0000-0000-0000-000000000000",{method:"PATCH",body:{decision:"approved"}});T("Direct approval edits are blocked",(r.status==401||r.status==403)?"PASS":"FAIL","HTTP "+r.status);
r=await rpc("decide_approval",{p_id:"00000000-0000-0000-0000-000000000000",p_decision:"approved",p_confirm:null});T("Approval function refuses an unknown request",!r.ok?"PASS":"FAIL",err(r));
if(biz&&owner()){r=await rpc("create_task",{p_business:biz,p_department:"test",p_title:"SECURITY TEST publication",p_instructions:"",p_inputs:{},p_worker:"claude",p_kind:"publishing",p_action:"book_release",p_payload:{ref:"test"},p_est_cost:0,p_mode:"manual_relay"});T("Publication cannot be created without a design review link",!r.ok?"PASS":"FAIL",err(r)+(r.ok?" (stray test task created; cancel it)":""))}else T("Publication needs a design review link","NOT RUN","Needs owner membership.");
T("Business access","INFO","You can see: "+(D.mem.map(m=>m.business+" ("+m.role+")").join(", ")||"nothing"));
busy=false;await load();render()}
document.addEventListener("click",onclick);
document.addEventListener("change",e=>{if(e.target.id=="n_k"){$("#n_a").innerHTML=acts(e.target.value)}if(e.target.id=="n_k"||e.target.id=="n_a")deps()});
setInterval(()=>{if(S&&!document.hidden&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")&&!busy)load()},5000);
render();if(S)load();
</script></body></html>
